<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Curriculum Coverage Monitor</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<script src="config.js"></script>
<body class="login-page">

  <div class="login-card">
    <div class="login-brand">
      <div class="login-brand-mark">📚</div>
      <h1 class="login-title">Curriculum Coverage Monitor</h1>
      <p class="login-subtitle">Gauteng Department of Education</p>
    </div>

    <div id="login-error" class="login-error" role="alert"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input class="input" type="email" id="email" autocomplete="email"
               placeholder="your@email.gov.za" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="input" type="password" id="password" autocomplete="current-password"
               placeholder="••••••••" required>
      </div>
      <button class="btn btn-primary" type="submit" id="login-btn" style="width:100%;justify-content:center;padding:.8rem;">
        Sign In
      </button>
    </form>

    <p style="text-align:center;margin-top:1.5rem;font-size:.8rem;color:var(--text-muted)">
      Access is restricted to authorised department personnel.
      <br>Contact your circuit manager for credentials.
    </p>
  </div>

  <script src="config.js"></script>
<script src="config.js"></script>
<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';

  const supabase = createClient(
    window.__ENV.SUPABASE_URL,
    window.__ENV.SUPABASE_ANON_KEY
  );

  const ROLE_HOME = {
    educator:            'capture.html',
    departmental_head:   'verification.html',
    curriculum_official: 'dashboard.html'
  };

  // Attach login handler immediately
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('login-error');
    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    try {
      const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
        email:    document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
      });
      if (authError) throw authError;

      const { data: profile, error: profileError } = await supabase
        .from('user_profiles')
        .select('role')
        .eq('id', authData.user.id)
        .single();

      if (profileError || !profile) {
        throw new Error('No user profile found. Contact your administrator.');
      }

      window.location.href = ROLE_HOME[profile.role] || 'dashboard.html';

    } catch (ex) {
      err.textContent = ex.message || 'Sign in failed. Please check your credentials.';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
